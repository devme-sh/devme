schema_version = 1

[stack]
name = "native-mobile-workspace"
description = "Explicit backend, iOS, and Android workspace orchestration"

[workspace.members]
backend = "backend"
ios = "apps/ios"
android = "apps/android"

# Persistence policy is workspace-wide so task, backend, simulator, and adb
# records can be correlated safely in one timestamped history.
[logs]
redact = [
  "(?i)authorization: bearer [^[:space:]]+",
  "CONVEX_DEPLOY_KEY=[^[:space:]]+",
  "(?i)(development|production):[A-Za-z0-9_-]+\\|[A-Za-z0-9_-]+",
]
retention_bytes = 8388608

[resource.ios-runtime]
scope = "host"
capacity = 2
env = "IOS_RUNTIME_SLOT"

[resource.android-runtime]
scope = "host"
capacity = 2
env = "ANDROID_RUNTIME_SLOT"

[resource.codesigning]
scope = "host"
capacity = 1

[task.check]
description = "Run backend, iOS, and Android verification"
depends_on = ["backend::test", "ios::test", "android::test"]
